# /etc/nginx/sites-available/testik  (setup-server.sh replaces __DOMAIN__)
# certbot --nginx adds the HTTPS server block and the http->https redirect to this file.

limit_req_zone $binary_remote_addr zone=testik_api:10m rate=10r/s;

upstream testik_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # www -> bare domain
    if ($host = www.__DOMAIN__) { return 301 https://__DOMAIN__$request_uri; }

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /_next/static/ {
        proxy_pass http://testik_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=testik_api burst=30 nodelay;
        proxy_pass http://testik_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://testik_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # App Router streams HTML, so do not buffer
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
